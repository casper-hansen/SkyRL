[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skyrl*"]

[project]
name = "skyrl"
dynamic = ["version"]
description = "Unified API for training and inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0.0",
    "pillow>=11.3.0",
    "rich>=14.1.0",
    "safetensors>=0.6.2",
    "tokenizers>=0.21.2",
    "transformers>=5.6.1,<=5.8.0",
    "typer>=0.17.4",
    "peft==0.18.1",
    "hf_transfer",
    "cloudpathlib>=0.23.0",
    "zstandard>=0.23.0",
    "xxhash>=3.0.0",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda12]>=0.7.2; sys_platform == 'linux'",
]

tpu = [
    "jax[tpu]>=0.7.2; sys_platform == 'linux'",
]

tinker = [
    "tinker>=0.3.0",
    "fastapi[standard]",
    "sqlmodel",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "asyncpg",
    "psycopg2-binary",
]

ray = [
    "ray[default]==2.56.0",
]

aws = [
    "cloudpathlib[s3]",
    "s5cmd>=0.3.3; sys_platform == 'linux'",
]

gcp = [
    "cloudpathlib[gs]",
]

azure = [
    "cloudpathlib[azure]",
]

# The extras "jax", "fsdp", and "megatron" are the dependencies the
# engine needs for --backend="jax", --backend="fsdp", and --backend="megatron",
# respectively.

jax = [
    "jax>=0.8,<1.0",
    "flax>=0.12.2",
    "optax>=0.2.5",
]

skyrl-train = [
    "loguru",
    "tqdm",
    "ninja",
    "tensorboard",
    "func_timeout",
    "hydra-core==1.3.2",
    "accelerate",
    "torchdata",
    "omegaconf",
    "ray==2.56.0",
    "peft==0.18.1",
    "debugpy==1.8.0",
    "hf_transfer",
    "wandb",
    "datasets>=4.0.0",
    "tensordict",
    "jaxtyping",
    "skyrl-gym",
    # flash-attn: no torch-2.11/cu13 wheels upstream; a CUDA-less stub crashes
    # TE (version-gated import of flash_attn_2_cuda), so it is omitted. HF models
    # fall back to SDPA; TE uses cuDNN fused attention.
    "polars",
    "s3fs",
    "s5cmd>=0.3.3; sys_platform == 'linux'",
    "gcsfs",
    "fastapi",
    "orjson>=3.11.9",
    "pybase64>=1.4.2",
    "uvicorn",
    "vllm-router; sys_platform == 'linux'",
    "pybind11",
    "setuptools",
    # The `nixl` shim provides that namespace and dispatches to the CUDA-13
    # variant (`nixl_cu13`); vLLM imports `nixl._api`. The metadata also
    # hard-depends on `nixl-cu12`, which is overridden out below so it doesn't
    # drag the CUDA-12 stack into the cu13 resolution.
    "nixl; sys_platform == 'linux'",
]

fsdp = [
    "skyrl[skyrl-train]",
    "vllm==0.23.0; sys_platform == 'linux'",
    "vllm-router; sys_platform == 'linux'",
    # The `nixl` shim provides that namespace and dispatches to the CUDA-13
    # variant (`nixl_cu13`); vLLM imports `nixl._api`. The metadata also
    # hard-depends on `nixl-cu12`, which is overridden out below so it doesn't
    # drag the CUDA-12 stack into the cu13 resolution.
    "nixl; sys_platform == 'linux'",
    "flash-linear-attention; sys_platform == 'linux'",
    "causal-conv1d; sys_platform == 'linux'",
    # flash-attn: no torch-2.11/cu13 wheels upstream; a CUDA-less stub crashes
    # TE (version-gated import of flash_attn_2_cuda), so it is omitted. HF models
    # fall back to SDPA; TE uses cuDNN fused attention.
    "torch==2.11.0; sys_platform == 'linux'",
    "flashinfer-python==0.6.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-jit-cache==0.6.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-cubin==0.6.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision; sys_platform == 'linux'",
]

megatron = [
    "skyrl[skyrl-train]",
    "transformer-engine[pytorch]==2.11.0; sys_platform == 'linux'",
    # Declared directly (not just via transformer-engine[pytorch]) so the
    # [tool.uv.sources] URL below is honored — uv ignores sources for
    # transitive-only packages, which would otherwise fall back to the PyPI sdist.
    "transformer-engine-torch==2.11.0; sys_platform == 'linux'",
    # TE core CUDA lib (libtransformer_engine.so). The CUDA-13 core matches the
    # cu13 torch/vllm stack and is the only TE core with Blackwell-Ultra
    # (sm103, e.g. B300) kernel images; the cu12 variant is overridden to
    # `never` below so the meta package's core resolution stays unambiguous.
    "transformer-engine-cu13==2.11.0; sys_platform == 'linux'",
    # No flash-attn: no torch-2.11/cu13 wheels exist upstream, and a
    # CUDA-less build (FLASH_ATTENTION_SKIP_CUDA_BUILD) is worse than absence
    # -- TE gates on the package *version* and then imports flash_attn_2_cuda
    # unconditionally, crashing at import. Without the package TE falls back
    # to cuDNN fused / unfused attention (the MLA path uses cuDNN anyway).
    "flash-linear-attention; sys_platform == 'linux'",
    "causal-conv1d; sys_platform == 'linux'",
    "mamba-ssm>=2.3.0; sys_platform == 'linux'",
    "vllm==0.23.0; sys_platform == 'linux'",
    "vllm-router; sys_platform == 'linux'",
    # The `nixl` shim provides that namespace and dispatches to the CUDA-13
    # variant (`nixl_cu13`); vLLM imports `nixl._api`. The metadata also
    # hard-depends on `nixl-cu12`, which is overridden out below so it doesn't
    # drag the CUDA-12 stack into the cu13 resolution.
    "nixl; sys_platform == 'linux'",
    "torch==2.11.0; sys_platform == 'linux'",
    "flashinfer-python==0.6.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision; sys_platform == 'linux'",
    # megatron-bridge requires Python 3.12+; pin megatron-core to the same
    # constraint so both packages are consistently available (or absent).
    "megatron-bridge; sys_platform == 'linux' and python_version >= '3.12'",
    "megatron-core; sys_platform == 'linux' and python_version >= '3.12'",
    "flashinfer-jit-cache==0.6.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-cubin==0.6.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-modelopt; sys_platform == 'linux'",
]

miniswe = [
    "skyrl[skyrl-train]",
    # NOTE (sumanthrh): Needs to be a commit after https://github.com/SWE-agent/mini-swe-agent/commit/4f5d445e99d13b5482478c23508bf2fbf7c0670c
    "mini-swe-agent>=1.12.0",
    "litellm",
]
harbor = [
    "harbor[daytona,modal]; python_version >= '3.12'",
]

dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.7",
    "pytest",
    "pytest-forked",
    "pytest-asyncio",
    "pre-commit",
    "litellm",
    "torch",
    "ty",
    "cloudpathlib[s3]",
    "alembic",
    "griffe2md",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "skyrl.__version__"}

[project.scripts]
# The following is for supporting the skyrl-train dependency

[tool.uv]
# Resolve for both Linux (production) and macOS (dev)
required-environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# each backend should have separate dependencies that can potentially clash
# megatron also clashes with the jax dependency from gpu and tpu extras
conflicts = [
    [
        { extra = "jax" },
        { extra = "megatron" },
        { extra = "fsdp" },
    ],
    [
        { extra = "megatron" },
        { extra = "gpu" },
        { extra = "tpu" },
        { extra = "miniswe" },
    ]
]
# disable build isolation for megatron related dependencies
no-build-isolation-package = [
    "transformer-engine-torch",
    "transformer-engine",
    "nv-grouped-gemm",
]
# override unnecessary dependencies and pin versions to override Megatron-Bridge
# unpinned dependencies.
override-dependencies = [
    "nvidia-resiliency-ext; sys_platform == 'never'",
    "transformer-engine[pytorch]==2.11.0; sys_platform == 'linux'",
    "transformers>=5.6.1,<=5.8.0; sys_platform == 'linux'",
    "megatron-core>=0.16.0; sys_platform == 'linux' and python_version >= '3.12'",
    "ml_dtypes>=0.5.0; sys_platform == 'linux'",
    "transformer-engine-cu12; sys_platform == 'never'",
    # `nixl` hard-depends on both nixl-cu12 and nixl-cu13; drop the cu12 variant
    # so it doesn't drag the CUDA-12 stack into the cu13 resolution.
    "nixl-cu12; sys_platform == 'never'",
    # Megatron-Bridge pins flashinfer-python==0.6.8.post1, which conflicts with
    # our exact 0.6.12 pin (the version vLLM 0.23.0 requires). Override it to our version.
    "flashinfer-python==0.6.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-jit-cache==0.6.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-cubin==0.6.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.extra-build-dependencies]
flash-attn = [{requirement = "torch", match-runtime = true}]
transformer-engine = [{requirement = "torch", match-runtime = true}, "build_tools", "ninja"]
transformer-engine-torch = [{requirement = "torch", match-runtime = true}, "build_tools", "ninja"]
causal-conv1d = [{requirement = "torch", match-runtime = true}, "ninja", "packaging"]
mamba-ssm = [{requirement = "torch", match-runtime = true}, "ninja", "packaging", "setuptools"]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE"}


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "jax-tpu"
url = "https://storage.googleapis.com/jax-releases/libtpu_releases.html"

[[tool.uv.index]]
name = "flashinfer-cu128"
url = "https://flashinfer.ai/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu129"
url = "https://flashinfer.ai/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "vllm-cu129"
url = "https://wheels.vllm.ai/0.23.0/cu129"
explicit = true

[tool.uv.sources]
skyrl-gym = { path = "./skyrl-gym", editable = true }
# cu130 build to match the CUDA-13 stack. Older caches lack Blackwell-Ultra
# (sm103, e.g. B300) kernel images: nvcc 12.8 cannot target sm103 at all, so
# flashinfer ops fail at runtime with "no kernel image is available".
flashinfer-jit-cache = { index = "flashinfer-cu130", marker = "sys_platform == 'linux'" }
# vllm from PyPI: the PyPI wheel is the CUDA-13 build, whose plain sm_100
# cubins are family-compatible with sm103 (B300) under CUDA 13 -- the cu129
# wheel ships sm_100a/sm_120a SASS only (no sm103, no PTX) and cannot run on
# Blackwell-Ultra. It links libcudart.so.13, supplied by torch's cu13 runtime.
#
# torch-2.11 wheels for flash-attn / causal-conv1d / mamba-ssm /
# transformer-engine-torch aren't published upstream; they are built from
# sdists at sync time against the runtime torch (see
# tool.uv.extra-build-dependencies). Set CUDA_HOME to a CUDA >= 13.0 toolkit
# when syncing so the extensions compile for the cu13 stack (and pick up
# sm103 on Blackwell-Ultra build hosts). flash-attn keeps
# FLASH_ATTENTION_SKIP_CUDA_BUILD=TRUE (no CUDA binary; TE and fla treat it
# as absent and fall back to their fused/triton paths).
# CUDA torch on Linux (PyPI default = CUDA 13 for torch 2.11), CPU torch on
# macOS (must match skyrl-train).
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
harbor = { git = "https://github.com/laude-institute/harbor", rev = "3de07a0e01f3368921766437fc7afece3ddec23d" }
megatron-bridge = {git = "https://github.com/NVIDIA-NeMo/Megatron-Bridge", rev = "91a15142a4b4442a8d46ab539d1b923bd08570d0", marker = "sys_platform == 'linux'"}
# megatron-core main branch: https://github.com/NVIDIA/Megatron-LM/tree/main latest as of 6/8/26
megatron-core = {git = "https://github.com/NVIDIA/Megatron-LM", rev = "71e418ea7d7b3a6c9a53238c543c3e0b43e11026", marker = "sys_platform == 'linux'"}
# NOTE (sumanthrh): This custom wheel of vllm-router includes a fix for /chat/completions endpoint: https://github.com/vllm-project/router/pull/162  on top of 0.1.14
# TODO (sumanthrh): Remove this after 0.1.15 vllm-router release
vllm-router = [
    { url = "https://github.com/SumanthRH/router/releases/download/0.1.14.post1/vllm_router-0.1.14.post1-cp38-abi3-manylinux_2_35_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/SumanthRH/router/releases/download/0.1.14.post1/vllm_router-0.1.14.post1-cp38-abi3-manylinux_2_28_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }
]


[tool.black]
line-length = 120
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 120
max-doc-length = 120
extend-ignore = [
    # Default ignored errors by flake8
    "E121", "E123", "E126", "E226", "E24", "E704",
    # F401 module imported but unused
    "F401",
    # E203 whitespace before ':' (conflict with black)
    "E203",
    # E231 missing whitespace after ',' (conflict with black)
    "E231",
    # E501 line too long (conflict with black)
    "E501",
    # E741 do not use variables named 'l', 'O', or 'I'
    "E741",
    # W503 line break before binary operator (conflict with black)
    "W503",
    # W504 line break after binary operator (conflict with black)
    "W504",
    # W505 doc line too long (conflict with black)
    "W505",
    # W605 invalid escape sequence 'x' (conflict with latex within docs)
    "W605",
]

[tool.ruff]
exclude = [
    "skyrl-agent/",
    "examples/",
]

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "F722" # Syntax error in annotation - ignored because this doesn't play well with jaxtyping
]

[tool.ruff.lint.isort]
known-first-party = ["skyrl", "skyrl_gym"]
